name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate correct keystore
      run: |
        rm -f app/keystore.jks
        keytool -genkey -v -keystore app/keystore.jks -alias dirtyfrag -keyalg RSA -keysize 2048 -validity 10000 -storepass dirtyfragpass -keypass dirtyfragpass -dname "CN=Android,O=Android,C=US"

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KurwaSu-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
