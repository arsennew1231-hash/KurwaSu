name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Keystore
      run: |
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias keystorem -passin pass:androidpassword -passout pass:androidpassword -dname "CN=Android,O=Android,C=US"

    - name: Build Debug APK
      run: ./gradlew assembleDebug -Pandroid.injected.signing.store.file=keystore.jks -Pandroid.injected.signing.store.password=androidpassword -Pandroid.injected.signing.key.alias=keystorem -Pandroid.injected.signing.key.password=androidpassword --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KurwaSu-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
