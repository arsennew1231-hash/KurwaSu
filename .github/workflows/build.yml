name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Patch build.gradle to use default debug signing
      run: |
        find app -name "build.gradle*" -type f -exec sed -i '/signingConfigs/,/}/c\    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n        }\n    }' {} +

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KurwaSu-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
