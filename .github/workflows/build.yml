name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Keystore on-the-fly
      run: |
        mkdir -p /home/runner/.gradle/daemon/9.7.1/
        keytool -genkey -v -keystore /home/runner/.gradle/daemon/9.7.1/keystores.jks -keyalg RSA -keysize 2048 -validity 10000 -alias dirtyfrag -storepass androidpassword -keypass androidpassword -dname "CN=Android,O=Android,C=US"
        mkdir -p app
        cp /home/runner/.gradle/daemon/9.7.1/keystores.jks app/keystore.jks

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug \
          -Pandroid.injected.signing.store.file=keystores.jks \
          -Pandroid.injected.signing.store.password=androidpassword \
          -Pandroid.injected.signing.key.alias=dirtyfrag \
          -Pandroid.injected.signing.key.password=androidpassword \
          --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KurwaSu-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
